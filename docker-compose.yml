# Ambiente local completo: broker MQTT + simulador de telemetria + backend AgHub.
# Uso: docker compose up --build   →   API em http://localhost:8010
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: agbot-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    container_name: agbot-backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      - mqtt-broker
    environment:
      MQTT_BROKER: mqtt-broker
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  simulator:
    build: ./backend
    container_name: agbot-simulator
    depends_on:
      - mqtt-broker
    environment:
      MQTT_BROKER: mqtt-broker
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./simulation:/simulation:ro
    command: ["python", "/simulation/telemetry_engine.py"]
